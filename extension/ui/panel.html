<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Sharh</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#analysis-workspace">Skip to analysis</a>
    <main>
      <header>
        <p class="eyebrow">Read closely</p>
        <h1>Sharh</h1>
        <p>Your reading workspace.</p>
      </header>
      <section aria-labelledby="read-heading">
        <h2 id="read-heading">Read a document</h2>
        <button id="read-page">Read current page</button><button id="open-current-pdf">Open current PDF</button><button id="open-reader">Open PDF or local file</button>
        <button id="enable-passages" hidden>Enable passage actions on this site</button>
        <p id="read-state" role="status"></p>
      </section>
      <div id="panel-scope"></div>
      <div id="analysis-workspace"></div>
      <section>
        <h2>Model connection</h2>
        <p>Set up Seatline to reach models through your signed-in CLIs.</p>
        <button id="settings">Open Seatline settings</button><button id="check">Check connection</button>
        <p id="state" role="status"></p>
        <div id="providers" aria-live="polite"></div>
      </section>
      <section aria-labelledby="run-status">
        <h2 id="run-status">Activity</h2>
        <p id="run-state" role="status">No turn running.</p>
        <button id="retry" hidden>Retry action</button><button id="stop" hidden>Stop</button>
      </section>
    </main>
    <script type="module" src="panel.mjs"></script>
  </body>
</html>
